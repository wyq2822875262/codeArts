services:
  gateway:
    build: .
    image: codearts-gateway:latest
    container_name: codearts-gateway
    restart: unless-stopped
    # 只监听本机，由 Nginx / Caddy 对外提供 HTTPS
    ports:
      - "127.0.0.1:7864:7864"
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
      TRUST_PROXY: "true"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7864/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
